# All secrets come from the environment (copy backend/.env.example to .env
# and fill in real values). Defaults below are dev-only placeholders.
services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://soc:${POSTGRES_PASSWORD:-soc}@postgres:5432/soc}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CUSTODY_KEY: ${CUSTODY_KEY:?set CUSTODY_KEY in .env}
      APP_ENV: ${APP_ENV:-production}
    depends_on: [postgres, neo4j]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    image: postgres:16
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-soc}
    volumes: [pgdata:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5
    env_file: [.env]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    # Localhost-only: the browser UI and DB consoles are dev tools, not public.
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neodata:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    env_file: [.env]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD in .env}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [esdata:/usr/share/elasticsearch/data]
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kavolume:/bitnami/kafka]
volumes:
  pgdata: {}
  neodata: {}
  esdata: {}
  kavolume: {}
