server {
    listen 80;
    server_name socforensics.io www.socforensics.io;
    root /usr/share/nginx/html;
    index index.html;

    # Custom domain: CNAME -> socforensics.io (Cloudflare DNS). Redirect www to apex.
    if ($host = www.socforensics.io) {
        return 301 https://socforensics.io$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static assets with long cache (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public SEO files — no cache confusion
    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|favicon\.svg|og-image\.svg|site\.webmanifest|CNAME)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Health and API proxy (when nginx fronts backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback: hash routes don't need try_files, but clean URLs and 404 should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 — SPA handles via JS, but nginx should also return index for client-side routing
    error_page 404 /index.html;
}
