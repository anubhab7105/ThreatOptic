apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-forensics-backend
spec:



  replicas: 2
  selector:
    matchLabels: { app: email-forensics-backend }
  template:
    metadata:
      labels: { app: email-forensics-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend




          image: email-forensics-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: soc-secrets, key: database-url } }
            - name: NEO4J_URI
              valueFrom: { secretKeyRef: { name: soc-secrets, key: neo4j-uri } }
            - name: NEO4J_USER
              valueFrom: { secretKeyRef: { name: soc-secrets, key: neo4j-user } }
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: soc-secrets, key: neo4j-password } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: soc-secrets, key: secret-key } }
            - name: CUSTODY_KEY
              valueFrom: { secretKeyRef: { name: soc-secrets, key: custody-key } }
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: soc-secrets, key: token-encryption-key } }
            - name: ELASTICSEARCH_URL


              value: "https://elasticsearch:9200"
            - name: ELASTICSEARCH_USER
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: soc-secrets, key: elastic-password } }
            - name: APP_ENV
              value: "production"
            - name: EXPECTED_REPLICAS
              value: "2"
            - name: CORS_ORIGINS
              value: "https://socforensics.io"
            - name: FRONTEND_URL
              value: "https://socforensics.io"
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: soc-secrets, key: google-client-id, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: soc-secrets, key: google-client-secret, optional: true } }
            - name: MS_CLIENT_ID
              valueFrom: { secretKeyRef: { name: soc-secrets, key: ms-client-id, optional: true } }
            - name: MS_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: soc-secrets, key: ms-client-secret, optional: true } }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/detailed, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: email-forensics-backend
spec:
  selector: { app: email-forensics-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-forensics-ingress
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["socforensics.io"]
      secretName: socforensics-tls
  rules:
    - host: socforensics.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: email-forensics-backend, port: { number: 8000 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: email-forensics-backend, port: { number: 8000 } } }
