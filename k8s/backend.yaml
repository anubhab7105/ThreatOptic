apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatoptic-backend
spec:
  # F8 constraint: replicas > 1 share NO in-memory state. The attribution
  # graph, the rate-limit counters, app.cache and _MISP_CACHE are all
  # per-process, so two pods answer from divergent graphs and divergent
  # buckets, and MAX_GRAPH_NODES eviction makes them diverge further.
  # graph_consistency_note() only *warns* about this at runtime, so the safe
  # default is 1 replica + EXPECTED_REPLICAS=1.
  # To scale out: configure a shared Neo4j, verify /health/detailed reports
  # the graph is served from Neo4j, THEN raise both values together and pin
  # the network to an external rate-limit store.
  replicas: 1
  selector:
    matchLabels: { app: threatoptic-backend }
  template:
    metadata:
      labels: { app: threatoptic-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          # RELEASE: images are immutable release tags (never :latest).
          # The release pipeline retags the tested image and,
          # where the registry supports it, pins the digest, e.g.
          #   threatoptic-backend:1.0.0@sha256:<digest from the push>
          image: threatoptic-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: database-url } }
            - name: NEO4J_URI
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: neo4j-uri } }
            - name: NEO4J_USER
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: neo4j-user } }
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: neo4j-password } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: secret-key } }
            - name: CUSTODY_KEY
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: custody-key } }
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: token-encryption-key } }
            - name: ELASTICSEARCH_URL
              # P0: credentials (basic_auth) cross this connection — plaintext
              # http is refused at boot in production (see require_secrets).
              value: "https://elasticsearch:9200"
            - name: ELASTICSEARCH_USER
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: elastic-password } }
            - name: APP_ENV
              value: "production"
            - name: EXPECTED_REPLICAS
              # Must match spec.replicas. >1 without a shared Neo4j makes
              # graph_consistency_note() fire and attribution diverge.
              value: "1"
            - name: CORS_ORIGINS
              value: "https://email-scanner-chi.vercel.app"
            - name: FRONTEND_URL
              value: "https://email-scanner-chi.vercel.app"
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: google-client-id, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: google-client-secret, optional: true } }
            - name: MS_CLIENT_ID
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: ms-client-id, optional: true } }
            - name: MS_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: threatoptic-secrets, key: ms-client-secret, optional: true } }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            # /health/ready, NOT /health/detailed. The detailed diagnostic is
            # rate limited per source address and every kubelet probe shares
            # one node address, so polling it let operator traffic evict the
            # probe and take the pod out of the Service.
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: threatoptic-backend
spec:
  selector: { app: threatoptic-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threatoptic-ingress
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["email-scanner-chi.vercel.app"]
      secretName: threatoptic-tls
  rules:
    - host: email-scanner-chi.vercel.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: threatoptic-backend, port: { number: 8000 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: threatoptic-backend, port: { number: 8000 } } }
