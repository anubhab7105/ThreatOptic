apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-forensics-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: email-forensics-backend }
  template:
    metadata:
      labels: { app: email-forensics-backend }
    spec:
      containers:
        - name: backend
          image: email-forensics-backend:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DATABASE_URL, value: "postgresql+psycopg2://soc:soc@postgres:5432/soc" }
            - { name: NEO4J_URI, value: "bolt://neo4j:7687" }
---
apiVersion: v1
kind: Service
metadata:
  name: email-forensics-backend
spec:
  selector: { app: email-forensics-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
