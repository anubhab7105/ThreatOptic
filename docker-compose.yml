# All secrets come from the environment. This file reads the REPO-ROOT .env
# (env_file below), which is also what the backend reads when you run it
# directly — one set of values, no hand-syncing. A backend/.env, if present,
# overrides it. Copy .env.example and fill in real values.
# Production uses Supabase Postgres — no local postgres service, so
# DATABASE_URL must point somewhere real before `docker compose up` works.
services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CUSTODY_KEY: ${CUSTODY_KEY:?set CUSTODY_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
    # No depends_on postgres — using Supabase
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
  neo4j:
    image: neo4j:5
    env_file: [.env]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-}
    # Localhost-only: the browser UI and DB consoles are dev tools, not public.
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neodata:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    env_file: [.env]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [esdata:/usr/share/elasticsearch/data]
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kavolume:/bitnami/kafka]
volumes:
  neodata: {}
  esdata: {}
  kavolume: {}
