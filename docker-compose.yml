services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://soc:soc@postgres:5432/soc
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: socsoc123
    depends_on: [postgres, neo4j]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    volumes: [pgdata:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/socsoc123
    ports: ["7474:7474", "7687:7687"]
    volumes: [neodata:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    ports: ["9092:9092"]
volumes:
  pgdata: {}
  neodata: {}
  esdata: {}
