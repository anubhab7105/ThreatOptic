server {
    listen 80;
    server_name socforensics.io www.socforensics.io;
    root /usr/share/nginx/html;
    index index.html;


    if ($host = www.socforensics.io) {
        return 301 https://socforensics.io$request_uri;
    }




    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;


    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|favicon\.svg|og-image\.svg|og-image\.png|site\.webmanifest|CNAME)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }


    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:8000/health;
    }




    location / {
        try_files $uri $uri/ /index.html;
        error_page 404 /index.html;
    }
}
